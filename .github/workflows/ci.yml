name: Verifiche
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: npx install-electron
      - run: python -m pip install -r requirements-qa.txt
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: node scripts/repo-check.mjs
      - run: node scripts/public-audit.mjs
